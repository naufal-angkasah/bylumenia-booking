<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EF"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A97F48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Outer Luxury Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="546" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Boutique Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#D4AF37">
    BUTIK VISUAL PERNIKAHAN • SEMARANG &amp; LUAR KOTA
  </text>

  <!-- Main Headline -->
  <text x="600" y="300" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="82" font-weight="300" letter-spacing="18" fill="#FFFFFF">
    BYLUMENIA
  </text>

  <!-- Poetic Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-style="italic" fill="#DDC388">
    "Bukan Dimana Kita Menemukan, Tapi Bagaimana Kita Menenun Rasa."
  </text>

  <!-- Bottom Badges -->
  <text x="600" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="400" letter-spacing="4" fill="rgba(255, 255, 255, 0.7)">
    SATU PASANGAN PER HARI  •  SINEMATIK EDITORIAL  •  SISTEM ANTI-TABRAKAN
  </text>

  <!-- Gold Star Accent -->
  <circle cx="600" y="145" r="4" fill="#D4AF37"/>
</svg>
